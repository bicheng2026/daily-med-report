name: 每日医学科研精读日报

on:
  # 北京时间每日 07:00(GitHub Actions 的 cron 使用 UTC:23:00 UTC = 次日 07:00 北京)
  schedule:
    - cron: "0 23 * * *"
  # 支持在 GitHub 网页上手动触发(首次部署后用来调试)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装系统依赖(pandoc / wkhtmltopdf / 中文字体)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf fonts-noto-cjk

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成今日日报
        run: python scripts/generate_report.py

      - name: 提交并推送日报
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "今日日报无变化(可能已生成),跳过提交"
          else
            git commit -m "docs: 每日医学科研精读日报 $(date +%Y%m%d)"
            git push
          fi
